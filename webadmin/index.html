<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Integration Engine - Administrator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YcnS/1nM6tGBe+hPBnOVpGEvrFn/GoCRops/" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
</head>
<body>

    <!-- ===== LOGIN SCREEN ===== -->
    <div id="login-screen">
        <div class="login-bg">
            <div class="login-container">
                <div class="login-header">
                    <div class="login-brand">Open Integration Engine</div>
                </div>
                <div class="login-body">
                    <div id="login-alert" class="login-alert" style="display:none;"></div>
                    <form id="login-form" autocomplete="on">
                        <div class="login-field">
                            <label for="login-server">Server URL</label>
                            <input type="text" id="login-server" value="" placeholder="https://localhost:8443" readonly class="login-input login-input-readonly">
                        </div>
                        <div class="login-field">
                            <label for="login-username">Username</label>
                            <input type="text" id="login-username" autocomplete="username" class="login-input" autofocus>
                        </div>
                        <div class="login-field">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" autocomplete="current-password" class="login-input">
                        </div>
                        <div class="login-actions">
                            <button type="submit" class="login-btn" id="login-btn">Login</button>
                        </div>
                    </form>
                    <div id="login-progress" class="login-progress" style="display:none;">
                        <div class="login-progress-bar"><div class="login-progress-fill"></div></div>
                        <span class="login-progress-text">Logging in...</span>
                    </div>
                </div>
                <div class="login-footer">
                    <span id="login-version"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== MAIN APPLICATION ===== -->
    <div id="main-app" style="display:none;">
        <!-- Main layout: taskpane | content area -->
        <div class="app-layout">
            <!-- Left Task Pane -->
            <div class="task-pane" id="task-pane">
                <div class="task-section" id="task-section-engine">
                    <div class="task-section-header" data-toggle-section="engine">
                        <i class="bi bi-chevron-down task-chevron"></i>
                        Engine
                    </div>
                    <div class="task-section-body">
                        <a href="#/dashboard" class="task-item active" data-nav="dashboard">
                            <i class="bi bi-speedometer2"></i> Dashboard
                            <span class="task-shortcut">D</span>
                        </a>
                        <a href="#/messages" class="task-item" data-nav="messages">
                            <i class="bi bi-envelope-open"></i> Messages
                            <span class="task-shortcut">M</span>
                        </a>
                        <a href="#/settings" class="task-item" data-nav="settings">
                            <i class="bi bi-gear"></i> Settings
                            <span class="task-shortcut">S</span>
                        </a>
                    </div>
                </div>
                <div class="task-section" id="task-section-actions">
                    <div class="task-section-header" data-toggle-section="actions">
                        <i class="bi bi-chevron-down task-chevron"></i>
                        <span id="task-actions-title">Dashboard Tasks</span>
                    </div>
                    <div class="task-section-body" id="task-actions-body">
                        <!-- Populated dynamically per view -->
                    </div>
                </div>
                <div class="task-section">
                    <div class="task-section-header" data-toggle-section="other">
                        <i class="bi bi-chevron-down task-chevron"></i>
                        Other
                    </div>
                    <div class="task-section-body">
                        <a href="#" class="task-item" id="task-logout">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </a>
                    </div>
                </div>
            </div>

            <!-- Right Content Area -->
            <div class="content-area">
                <!-- Content Title Bar -->
                <div class="content-title-bar" id="content-title-bar">
                    <span class="content-title" id="content-title">Dashboard</span>
                </div>
                <!-- Content Body -->
                <div class="content-body" id="content-body">
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar" id="status-bar">
            <div class="status-left">
                <i class="bi bi-hdd-network"></i>
                <span id="status-server-info">Connected</span>
                <span class="status-sep">|</span>
                <span id="status-user"></span>
            </div>
            <div class="status-right">
                <span id="status-working" class="status-working" style="display:none;">
                    <span class="status-spinner"></span> Working...
                </span>
                <span class="status-sep">|</span>
                <span id="status-time"></span>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="js/api.js"></script>
    <script src="js/router.js"></script>
    <script src="js/views/login.js"></script>
    <script src="js/views/dashboard.js"></script>
    <script src="js/views/messages.js"></script>
    <script src="js/views/settings.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
